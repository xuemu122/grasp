limit_req_zone $binary_remote_addr zone=order_prepare:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=payment_query:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 8082 ssl;
    server_name gaowei.dxtxl.com;

    ssl_certificate /etc/nginx/ssl/nginx/dxtxl.com.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx/dxtxl.com.key;

    root /var/www/qianduan;
    index index.html;

    # 支付流程会随前后端接口一起更新，HTML/JS/CSS 禁止使用旧缓存。
    location ~* \.(html|css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # API 代理到 Node 服务 (HTTP 3000)
    location = /api/orders/prepare {
        limit_req zone=order_prepare burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000/api/orders/prepare;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/orders/[^/]+/(payment|cancel-payment|refund)$ {
        limit_req zone=payment_query burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/admin/login {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000/api/admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理页面
    location = /admin.html {
        proxy_pass http://127.0.0.1:3000/admin.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # 其他页面回退到 index.html
    location / {
        try_files $uri $uri/ @node;
    }

    location @node {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 代理 (端口 3001)
    location /ws/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
