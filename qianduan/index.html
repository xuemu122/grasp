<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器人智能点单平台</title>

    <link rel="stylesheet" href="style.css?v=voice-37">

</head>
<body>
    <!-- 商家登录 -->
    <div class="order-login-overlay" id="orderLoginOverlay" hidden>
        <form class="order-login-panel" id="orderLoginForm">
            <h1 id="orderLoginTitle">门店点单登录</h1>
            <p id="orderLoginDesc">请使用平台分配的商家账号登录</p>
            <div class="order-login-field">
                <label for="orderLoginUsername" id="orderLoginUsernameLabel">商家账号</label>
                <input class="order-login-input" id="orderLoginUsername" autocomplete="username" required autofocus>
            </div>
            <div class="order-login-field">
                <label for="orderLoginPassword">密码</label>
                <input class="order-login-input" id="orderLoginPassword" type="password" autocomplete="current-password" required>
            </div>
            <div class="order-login-error" id="orderLoginError" role="alert"></div>
            <button class="btn-submit" id="orderLoginSubmit" type="submit">登录</button>
        </form>
    </div>

    <!-- 熄屏/唤醒页面 -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo-wrap">
                <img class="splash-logo" src="lanyu.jpg" alt="蓝羽机器人">
            </div>
            <h1 class="splash-title">蓝羽机器人售货商店</h1>
            <p class="splash-text">触摸屏幕开始点单</p>
            <p class="splash-hint">点击任意位置进入</p>
        </div>
    </div>

    <!-- 顶部导航 -->
    <header class="top-header">
        <div class="header-inner">
            <div class="brand">
                <span class="brand-logo">🤖</span>
                <div class="brand-text">
                    <h1>智能点单平台</h1>
                    <p>机器人自动抓取 · 智能点单</p>
                </div>
            </div>
            <div class="header-search">
                <input type="text" id="searchInput" placeholder="搜索或点击语音按钮说话" autocomplete="off">
                <button type="button" class="voice-mode-btn" id="voiceModeSearch" onclick="handleVoiceButton('search')" title="语音检索：说话筛选商品"><span class="vm-icon">🎤</span>语音检索</button>
                <button class="btn-search" onclick="handleSearch()">🔍</button>
            </div>
            <button type="button" class="voice-mode-btn" id="voiceModeOrder" onclick="handleVoiceButton('order')" title="语音点单：说话加入购物车"><span class="vm-icon">🛒</span>语音点单</button>
            <div class="voice-hint" id="voiceHint" style="display:none;">
                <span class="voice-hint-dot"></span>
                <span id="voiceHintText">正在聆听...</span>
            </div>
            <div class="header-status">
                <span class="robot-status" id="robotStatus">
                    <span class="status-dot" style="background:#EF4444;box-shadow:0 0 8px rgba(239,68,68,0.6)"></span> 后端未连接
                </span>
                <span class="robot-status" id="powerStatus" hidden></span>
            </div>
        </div>
    </header>

    <!-- 门店 / 设备上下文 -->
    <div class="order-context" id="orderContext" hidden>
        <span class="order-context-merchant" id="orderMerchantName"></span>
        <label class="order-context-field">门店
            <select id="orderStoreSelect" onchange="onOrderStoreChange()"></select>
        </label>
        <label class="order-context-field">设备
            <select id="orderDeviceSelect" onchange="onOrderDeviceChange()"></select>
        </label>
        <span class="order-context-device-status" id="orderDeviceStatus"></span>
        <button type="button" class="order-context-logout" id="orderLogoutBtn" onclick="logoutOrderMerchant()">退出</button>
    </div>

    <!-- 主内容区 -->
    <div class="page-layout">
        <!-- 左侧：分类导航 -->
        <aside class="category-sidebar">
            <h2 class="sidebar-title">商品分类</h2>
            <nav class="category-list" id="categoryList">
                <!-- JS 动态生成 -->
            </nav>
        </aside>

        <!-- 中间：商品列表 -->
        <main class="products-area">
            <div class="products-header">
                <h2 id="currentCategoryTitle">全部商品</h2>
                <span class="products-count" id="productsCount">加载中...</span>
            </div>
            <div class="products-grid" id="productsGrid">
                <!-- JS 动态生成 -->
            </div>
        </main>

        <!-- 右侧：购物车（悬浮浮窗，hover 展开） -->
        <aside class="cart-sidebar" id="cartSidebar">
            <div class="cart-header" role="button" tabindex="0" aria-label="展开购物车" aria-expanded="false" onclick="toggleCart(event)" onkeydown="handleCartKeydown(event)">
                <span class="cart-icon" aria-hidden="true">🛒</span>
                <h2>购物车</h2>
                <span class="cart-badge" id="cartBadge" data-count="0"></span>
            </div>
            <div class="cart-items" id="cartItems">
                <div class="cart-empty">
                    <span class="empty-icon">🛒</span>
                    <p>购物车是空的</p>
                    <p class="empty-hint">点击商品添加</p>
                </div>
            </div>
            <div class="cart-footer" id="cartFooter" style="display: none;">
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>商品件数</span>
                        <span id="cartQty">0</span>
                    </div>
                    <div class="summary-row total">
                        <span>合计</span>
                        <span class="total-price" id="totalPrice">¥0.00</span>
                    </div>
                </div>
                <button class="btn-clear-cart-footer" onclick="clearCart()">清空购物车</button>
                <button class="btn-submit" id="btnSubmit" onclick="submitOrder()">
                    开始支付
                </button>
            </div>
        </aside>
    </div>

    <!-- 动画弹窗 -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal-content" id="modalContent">
            <!-- JS 动态生成 -->
        </div>
    </div>

    <!-- 订单完成提示 -->
    <div class="order-toast" id="orderToast" style="display: none;">
        <div class="toast-content" id="toastContent"></div>
    </div>

    <script src="script.js?v=voice-asr-3"></script>
</body>
</html>
