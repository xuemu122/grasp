    layer_height_m: 1.05      # 该层中心距地面高度(m)
    horizontal_offset: 0.5    # 水平偏移(从货架左侧算起，单位m)
    description: "旧模型类别兜底"

# 深度相机参数（用于坐标转换）
camera_config:
  # 相机安装高度(距离地面)
  camera_height: 2.0
  # 相机俯仰角(度)，正值为向下俯视
  pitch_angle: 30
  # 相机到货架的水平距离
  distance_to_shelf: 1.5
  # 图像宽度/高度
  image_width: 640
  image_height: 480
