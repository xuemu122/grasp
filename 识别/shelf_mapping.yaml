# 零售商品-货架-坐标映射表
# 根据实际门店/货架测量数据填写

# 货架配置
shelves:
  S01:
    description: "1号货架"
    total_layers: 5          # 总层数
    layer_height: 0.35       # 每层高度(m)
    base_height: 0.3         # 第一层底部距地面高度(m)
    width: 1.2               # 货架宽度(m)

# 商品词典映射 (OCR商品名/别名 -> 货架信息)
# YOLO 只负责检测“商品区域/包装形态”，具体商品由 OCR 文本匹配这里的 name 和 aliases。
product_catalog:
  amoxicillin_capsule:
    name: "阿莫西林胶囊"
    aliases: ["阿莫西林", "阿莫西林胶囊", "amoxicillin"]
    category: "medicine"
    package_type: "box"
    shelf_id: "S01"
    layer: 2
    layer_height_m: 1.05
    horizontal_offset: 0.5
    description: "阿莫西林胶囊"

  vitamin_c_tablet:
    name: "维生素C片"
    aliases: ["维生素C", "维生素c", "维C", "维c", "vc"]
    category: "medicine"
    package_type: "box"
    shelf_id: "S01"
    layer: 2
    layer_height_m: 1.05
    horizontal_offset: 0.6
    description: "维生素C片"

  coca_cola_500ml:
    name: "可口可乐 500ml"
    aliases: ["可口可乐", "可乐", "coca cola", "coke"]
    barcode: ["6928804011148"]
    category: "drink"
    package_type: "bottle"
    shelf_id: "S01"
    layer: 3
    layer_height_m: 1.40
    horizontal_offset: 0.3
    description: "便利店饮料示例"

  nongfu_spring_550ml:
    name: "农夫山泉 550ml"
    aliases: ["农夫山泉", "农夫山泉天然水"]
    category: "drink"
    package_type: "bottle"
    shelf_id: "S01"
    layer: 3
    layer_height_m: 1.40
    horizontal_offset: 0.45
    description: "便利店饮料示例"

  lays_chips:
    name: "乐事薯片"
    aliases: ["乐事", "薯片", "lays", "lay's"]
    category: "snack"
    package_type: "bag"
    shelf_id: "S01"
    layer: 4
    layer_height_m: 1.75
    horizontal_offset: 0.7
    description: "便利店零食示例"

# OCR 匹配策略
matching:
  # 过滤过短别名，避免用 500ml、vc 等弱特征误匹配大量商品。
  min_ocr_alias_chars: 3
  # 当前 yolo_rpc_test 是 200 类 SKU 数据集，默认使用 YOLO 类别作为主身份。
  prefer_ocr_over_yolo: false

# RPC 数据集大类兜底映射
# yolo_rpc_test 是 200 类 SKU 数据集，但类别名只有大类+编号。
# 如果没有精确 SKU 货架位置，可先按大类落到默认货架层。
