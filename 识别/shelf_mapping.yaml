# YOLO类别兜底映射
# OCR 无结果或未命中商品词典时，才使用这里的类别映射。
yolo_fallback_mapping:
  product_box:
    shelf_id: "S01"
    layer: 2
    layer_height_m: 1.05
    horizontal_offset: 0.5
    description: "未知盒装商品"
  product_bottle:
    shelf_id: "S01"
    layer: 3
    layer_height_m: 1.40
    horizontal_offset: 0.4
    description: "未知瓶装商品"
