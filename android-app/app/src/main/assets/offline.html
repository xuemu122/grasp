<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无法连接</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; background:#f5f5f5; color:#333; }
        .box { text-align:center; padding:40px; }
        .icon { font-size:64px; margin-bottom:20px; }
        h2 { margin-bottom:10px; }
        p { color:#666; font-size:14px; margin-bottom:20px; }
        button { background:#2196F3; color:#fff; border:none; padding:12px 30px; border-radius:6px; font-size:16px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h2>网络连接失败</h2>
        <p>请检查网络后重试</p>
        <button onclick="location.reload()">重新加载</button>
    </div>
</body>
</html>
